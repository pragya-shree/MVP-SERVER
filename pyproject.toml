[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anything-to-mcp"
version = "0.1.0"
description = "Production-minded OpenAPI-to-MCP server generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0.1",
    "openapi-spec-validator>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
anything-to-mcp = "backend.generator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "demo_api*", "agent*"]
exclude = ["generated*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
