openapi: 3.0.3
info:
  title: Store Inventory API
  description: Updated Store API featuring added, removed, renamed, and modified endpoints.
  version: 2.0.0
servers:
  - url: http://127.0.0.1:8000/v1
    description: Local Test Server

paths:
  /items:
    get:
      operationId: list_items
      summary: List inventory items with pagination
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        # Changed parameter schema: added max_results constraint
        - name: max_results
          in: query
          required: false
          description: Maximum items to return
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'

    post:
      operationId: create_item
      summary: Add an inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
      responses:
        '201':
          description: Item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'

  # Newly added endpoint
  /items/search:
    get:
      operationId: search_items
      summary: Search items by query keyword
      parameters:
        - name: q
          in: query
          required: true
          description: Search keyword
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'

  /items/{item_id}:
    parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
    # Renamed operation ID from get_item -> fetch_item_details
    get:
      operationId: fetch_item_details
      summary: Fetch item details by identifier
      responses:
        '200':
          description: Item details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          description: Not found

  # Notice: delete_item has been removed!

components:
  schemas:
    Item:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number

    CreateItemRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        price:
          type: number
