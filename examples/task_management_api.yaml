openapi: 3.0.3
info:
  title: Task Management API
  description: A production-ready API for managing projects and team tasks.
  version: 1.0.0
servers:
  - url: https://api.taskmanager.example.com/v1
    description: Production Server
  - url: http://localhost:8000/v1
    description: Local Development Server

security:
  - BearerAuth: []

paths:
  /tasks:
    get:
      operationId: listTasks
      summary: List all tasks
      description: Retrieve a paginated list of tasks filtered by status.
      tags:
        - tasks
      security: []  # Explicit public endpoint override
      parameters:
        - name: status
          in: query
          description: Filter tasks by current status
          required: false
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Successful retrieval of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ErrorResponse'

    post:
      operationId: createTask
      summary: Create a new task
      tags:
        - tasks
      requestBody:
        description: Task payload
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          $ref: '#/components/responses/ErrorResponse'

  /tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskIdParam'
    get:
      operationId: getTaskById
      summary: Get task details
      tags:
        - tasks
      responses:
        '200':
          description: Task found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      operationId: deleteTask
      summary: Delete a task
      tags:
        - tasks
      responses:
        '204':
          description: Task successfully deleted

  /projects/{project_id}/tasks:
    parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get project tasks without operationId
      tags:
        - projects
      responses:
        '200':
          description: List of project tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    TaskIdParam:
      name: task_id
      in: path
      required: true
      description: Unique identifier of the task
      schema:
        type: string
        format: uuid
    LimitParam:
      name: limit
      in: query
      required: false
      description: Number of results to return
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    OffsetParam:
      name: offset
      in: query
      required: false
      description: Number of results to skip
      schema:
        type: integer
        default: 0
        minimum: 0

  schemas:
    TaskStatus:
      type: string
      enum:
        - todo
        - in_progress
        - completed
        - archived
      default: todo

    Priority:
      type: string
      enum: [low, medium, high, urgent]
      default: medium

    Assignee:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email

    Task:
      type: object
      required:
        - id
        - title
        - status
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/Priority'
        assignee:
          $ref: '#/components/schemas/Assignee'
        tags:
          type: array
          items:
            type: string

    CreateTaskRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          $ref: '#/components/schemas/Priority'
        assignee_id:
          type: string

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string

  responses:
    ErrorResponse:
      description: Standard API error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
