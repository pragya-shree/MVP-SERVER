openapi: 3.0.3
info:
  title: Circular Schema API
  version: 1.0.0
paths:
  /categories:
    get:
      operationId: getCategories
      summary: Get hierarchy of categories
      responses:
        '200':
          description: Category hierarchy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
components:
  schemas:
    Category:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        parent:
          $ref: '#/components/schemas/Category'
        subcategories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
